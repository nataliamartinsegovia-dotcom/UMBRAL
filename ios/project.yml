name: Umbral
options:
  bundleIdPrefix: com.umbral
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
targets:
  Umbral:
    type: application
    platform: iOS
    sources:
      - path: Umbral
        excludes:
          - "Resources/Fonts/**"
      - path: Shared
    resources:
      - path: Umbral/Resources/Assets.xcassets
    info:
      path: Umbral/Info.plist
      properties:
        CFBundleDisplayName: umbral
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.umbral.app.whoop
            CFBundleURLSchemes:
              - umbral
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.umbral.app.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbral.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: YY5DL994SR
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Umbral/Umbral.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.umbral.app
    dependencies:
      - target: UmbralWidgetExtension
        embed: true

  UmbralWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: UmbralWidget
      - path: Shared
    info:
      path: UmbralWidget/Info.plist
      properties:
        CFBundleDisplayName: Umbral
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umbral.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: YY5DL994SR
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: UmbralWidget/UmbralWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.umbral.app
schemes:
  Umbral:
    build:
      targets:
        Umbral: all
        UmbralWidgetExtension: all
    run:
      config: Debug
