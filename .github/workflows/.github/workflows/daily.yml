name: Sincronización diaria WHOOP

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: whoop-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests pynacl

      - name: Refrescar token y descargar datos de WHOOP
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fetch_whoop.py

      - name: Commit de los datos nuevos
        run: |
          git config user.name "whoop-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "sync: datos WHOOP $(date -u +%F)"
          git push
