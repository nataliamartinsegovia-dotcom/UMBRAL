<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>umbral · 67</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#0F0F0F; --rule:#0F0F0F; --line:#EEEEEE; --line2:#E4E4E4;
  --panel:#FFFFFF; --alt:#F5F5F5; --dim:#8A8A8A; --dimmer:#B8B8B8;
  --mus:#C9A227; --amb:#8E6A0F;
  --arch:'Archivo',sans-serif; --mono:'JetBrains Mono',monospace; --hand:'Caveat',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--mono);-webkit-font-smoothing:antialiased}
a{color:var(--amb);text-decoration:none}
a:hover{color:var(--mus)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--mus);color:var(--ink)}
:focus-visible{outline:2px solid var(--mus);outline-offset:2px}

/* type ladder */
.arch{font-family:var(--arch)}
.mono{font-family:var(--mono)}
.hand{font-family:var(--hand);color:var(--amb);line-height:1}
.num{font-variant-numeric:tabular-nums}
.t-h1{font-family:var(--arch);font-weight:700;font-size:clamp(72px,10vw,120px);line-height:.78;letter-spacing:-.03em}
.t-h2{font-family:var(--arch);font-weight:600;font-size:clamp(22px,2.4vw,30px);line-height:1;letter-spacing:-.02em}
.t-h3{font-family:var(--arch);font-weight:600;font-size:clamp(18px,1.8vw,24px);line-height:1.05;letter-spacing:-.01em}
.t-num-lg{font-family:var(--arch);font-weight:700;font-size:clamp(38px,4.5vw,56px);line-height:.85;letter-spacing:-.03em}
.t-num-md{font-family:var(--arch);font-weight:600;font-size:clamp(22px,2.2vw,28px);line-height:1;letter-spacing:-.01em}
.t-body{font-size:13px;line-height:1.55}
.t-label{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.t-micro{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.dim{color:var(--dim)}

/* full-bleed shell */
.app{width:100%;min-height:100vh;background:var(--bg)}
.pad{padding-left:clamp(20px,4vw,56px);padding-right:clamp(20px,4vw,56px)}

/* wordmark D · lockup */
.wm{display:inline-flex;align-items:flex-end;gap:14px;line-height:.9}
.wm .wm-word{font-family:var(--arch);font-weight:400;font-size:clamp(28px,3vw,42px);letter-spacing:-.03em;line-height:.85}
.wm .wm-rule{width:1px;background:var(--ink);align-self:stretch;margin:4px 0 5px}
.wm .wm-thr{font-family:var(--arch);font-weight:700;font-size:clamp(24px,2.6vw,36px);line-height:.85;color:var(--mus);letter-spacing:-.03em}
.wm .wm-thr small{font-family:var(--mono);font-weight:400;font-size:.28em;color:var(--ink);opacity:.55;letter-spacing:.08em;margin-left:3px;vertical-align:top;position:relative;top:6px}

/* top bar */
.top{padding-top:22px;padding-bottom:18px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--rule);gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:0;flex-wrap:wrap}
.tabs button{padding:10px 16px;display:flex;align-items:center;gap:10px;transition:background .15s}
.tabs button .tab-letter{font-family:var(--mono);font-size:10px;opacity:.4;letter-spacing:.06em;text-transform:uppercase}
.tabs button .tab-label{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-current="true"] .tab-letter{color:var(--bg);opacity:.55}
.burger{display:none;width:44px;height:44px;align-items:center;justify-content:center;
  border:1px solid var(--ink);flex-shrink:0}
.burger i,.burger i::before,.burger i::after{content:'';display:block;width:18px;height:1.5px;background:var(--ink);position:relative}
.burger i::before{position:absolute;top:-6px;left:0}
.burger i::after{position:absolute;top:6px;left:0}
.sync-chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--ink)}

/* main padding */
.main{padding-top:32px;padding-bottom:20px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.hd h1{margin:0}

/* HOY */
.hoy-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:2px;background:var(--ink);border:1px solid var(--ink)}
.hoy-cell{background:var(--panel);padding:28px}
.hoy-cell.alt{background:var(--alt)}
.hoy-cell .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.hoy-metric{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hoy-metric .lab{display:flex;align-items:center;gap:6px}

.badge{display:inline-block;padding:5px 10px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-top:12px}
.badge.b-under{background:var(--mus);color:var(--ink)}
.badge.b-over{background:var(--ink);color:var(--bg)}
.badge.b-none{background:var(--alt);color:var(--dim);border:1px solid var(--line2)}

.sesion-hoy{margin-top:2px;padding:26px;background:var(--panel);border:1px solid var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.sesion-hoy.vacio{background:var(--alt);border-style:dashed}
.line-chart{margin-top:2px;padding:22px 26px;background:var(--panel);border:1px solid var(--ink);border-top:0}
.line-chart .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:6px}

/* SEMANA */
.datebox{border:1px solid var(--ink);background:var(--panel);padding:16px 18px;margin-bottom:2px}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.datenav button.arr{width:32px;height:32px;border:1px solid var(--ink);background:var(--panel)}
.datenav .anio{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em}
.meses{display:flex;flex:1;gap:2px;overflow-x:auto;min-width:0}
.mes{flex:1;text-align:center;padding:8px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);border-bottom:2px solid var(--line2);cursor:pointer;
  min-width:44px;background:none}
.mes.on{color:var(--ink);border-bottom-color:var(--mus)}
.densidad{display:flex;gap:1px;height:20px;margin-bottom:8px}
.densidad>div{flex:1;background:var(--line);cursor:pointer;min-width:4px;border:0}
.densidad>div.hi{background:var(--mus)}
.densidad>div.md{background:var(--mus);opacity:.4}
.densidad>div.sel{outline:1.5px solid var(--ink);outline-offset:-1px}
.semlab{font-family:var(--mono);font-size:11px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.semlab b{font-weight:500}
.chip{font-family:var(--mono);font-size:10px;padding:8px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--ink);letter-spacing:.06em;text-transform:uppercase;min-height:36px}
.chip:hover{background:var(--alt)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.sem-analisis{display:grid;grid-template-columns:1.4fr 1fr;gap:2px;background:var(--ink);border:1px solid var(--ink);margin-top:2px}
.sem-analisis .cell{background:var(--panel);padding:20px}
.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 20px}
.metricas .m .v{font-family:var(--arch);font-weight:700;font-size:26px;line-height:1;margin-top:4px;letter-spacing:-.02em}
.metricas .m .bar{height:3px;background:var(--line);margin-top:8px;position:relative}
.metricas .m .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mus)}
.foco-in{width:100%;background:var(--bg);border:1px solid var(--ink);padding:10px 12px;font-family:var(--mono);font-size:13px;margin-top:8px}
.foco-in:focus{outline:none;border-color:var(--mus);border-width:2px;padding:9px 11px}

/* week table */
.wtable{border:1px solid var(--ink);border-top:0;background:var(--panel)}
.wtable .cab{display:grid;grid-template-columns:110px minmax(0,1fr) 90px 60px 130px 44px;
  gap:12px;padding:12px 16px;background:var(--alt);border-bottom:1px solid var(--ink)}
.wtable .cab span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.wrow{border-top:1px solid var(--line);cursor:pointer;transition:background .1s}
.wrow.first{border-top:0}
.wrow:hover{background:var(--alt)}
.wrow.hoy{background:#FFFBE9}
.wrow.hoy:hover{background:#FEF6D6}
.wrow .grid{display:grid;grid-template-columns:110px minmax(0,1fr) 90px 60px 130px 44px;
  gap:12px;padding:14px 16px;align-items:center}
.wrow .dia{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:12px;font-weight:500}
.wrow .dia small{font-family:var(--mono);font-size:9px;color:var(--mus);font-weight:700;letter-spacing:.08em}
.wrow .tit{font-family:var(--arch);font-size:15px;font-weight:500;letter-spacing:-.01em}
.wrow .tit .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:2px;font-weight:400}
.wrow .tit .empty{color:var(--dimmer);font-family:var(--mono);font-size:11px;font-style:italic}
.wrow .rec,.wrow .zn{font-family:var(--arch);font-size:16px;font-weight:600}
.wrow .est{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.wrow .est.hecha{color:var(--ink)}
.wrow .est.nohecha{color:#B24C1C}
.wrow .est.pend{color:var(--dim)}
.wrow .est.sinplan{color:var(--dimmer)}
.wrow .est .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.wrow .caret{display:flex;align-items:center;justify-content:center;color:var(--dim)}
.wrow[aria-expanded="true"] .caret svg{transform:rotate(180deg)}
.editor{display:none;padding:0}
.wrow[aria-expanded="true"] + .editor{display:block;background:var(--alt);border-top:1px solid var(--ink)}
.editor-inner{padding:22px 20px 26px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.form-row{display:flex;flex-direction:column;gap:8px}
.form-row label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.form-row input[type=text],.form-row textarea,.form-row select{background:var(--bg);border:1px solid var(--ink);padding:9px 10px;font-size:13px}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--mus);border-width:2px;padding:8px 9px}
.form-row textarea{min-height:60px;resize:vertical;font-family:inherit}
.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.slider label b{color:var(--ink);font-weight:500;font-family:var(--arch);font-size:14px}
input[type=range]{-webkit-appearance:none;width:100%;background:transparent;margin:0;padding:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--mus);border-radius:50%;margin-top:-5.5px;cursor:pointer}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--mus);border:0;border-radius:50%;cursor:pointer}
.chips-row{display:flex;gap:1px;background:var(--ink);flex-wrap:wrap;border:1px solid var(--ink)}
.chips-row button{flex:1;padding:10px 8px;background:var(--panel);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;min-height:40px}
.chips-row button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.detail-panel{background:var(--bg);border:1px solid var(--ink);padding:16px 18px}
.detail-panel h4{margin:0 0 12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:6px}
.spec{width:100%;border-collapse:collapse}
.spec tr{border-bottom:1px solid var(--line)}
.spec tr:last-child{border-bottom:0}
.spec td{padding:8px 0;font-size:12px}
.spec td:first-child{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);width:50%}
.spec td:last-child{text-align:right;font-family:var(--arch);font-weight:600}

.acc-bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0 4px;gap:14px;flex-wrap:wrap;margin-top:20px;border-top:1px solid var(--ink)}
.btn{background:var(--ink);color:var(--bg);padding:12px 18px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;min-height:44px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink)}
.btn:hover{background:var(--amb);border-color:var(--amb)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.msg{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.msg.dirty{color:var(--amb)}

/* REGISTRO */
.buscador{margin-bottom:14px;position:relative}
.buscador input{width:100%;background:var(--panel);border:1px solid var(--ink);padding:14px 16px 14px 42px;font-size:14px;font-family:var(--arch)}
.buscador input:focus{outline:none;border-color:var(--mus);border-width:2px;padding:13px 15px 13px 41px}
.buscador svg{position:absolute;left:14px;top:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 18px;border-bottom:1px solid var(--ink);margin-bottom:2px}
.filtros .rango{display:flex;flex-direction:column;gap:4px}
.filtros .rango input[type=date]{background:var(--panel);border:1px solid var(--ink);padding:8px 10px;font-family:var(--mono);font-size:11px}
.rlista{border:1px solid var(--ink);border-top:0;background:var(--panel)}
.rrow{border-top:1px solid var(--line);cursor:pointer}
.rrow.first{border-top:0}
.rrow:hover{background:var(--alt)}
.rrow .grid{display:grid;grid-template-columns:24px minmax(0,1fr) 90px 90px 44px;gap:14px;padding:14px 18px;align-items:center}
.rrow .disc-dot{width:14px;height:14px;background:var(--ink);border-radius:2px}
.rrow .t{font-family:var(--arch);font-size:15px;font-weight:500;letter-spacing:-.01em}
.rrow .t .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:400;margin-top:2px}
.rrow .rec,.rrow .fecha{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
.rrow .rec b{color:var(--ink);font-family:var(--arch);font-size:15px;font-weight:600}
.rrow .caret{color:var(--dim);display:flex;justify-content:center}
.rrow[aria-expanded="true"] .caret svg{transform:rotate(180deg)}
.rdetail{display:none;background:var(--alt);border-top:1px solid var(--ink);padding:20px}
.rrow[aria-expanded="true"] + .rdetail{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.rdetail .prose p{font-size:13px;line-height:1.55;margin:0 0 10px}
.rdetail .prose .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;margin-top:14px}
.rdetail .prose .k:first-child{margin-top:0}

/* RÉCORDS */
.rec-form{background:var(--alt);border:1px solid var(--ink);padding:22px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.rec-form.hide{display:none}
.rec-form .full{grid-column:1/-1}
.rec-item{background:var(--panel);border:1px solid var(--ink);padding:22px 24px;margin-bottom:2px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.rec-item .disc{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rec-item .nom{font-family:var(--arch);font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.rec-item .best-lab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:right}
.rec-item .best{font-family:var(--arch);font-size:36px;font-weight:700;letter-spacing:-.02em;color:var(--mus);text-align:right}
.rec-item .history{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.rec-item .history h5{margin:0 0 10px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500}
.hist-list{display:flex;flex-direction:column;gap:6px}
.hist-list .h{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
.rec-item .add-btn{grid-column:1/-1;margin-top:10px}

/* footer */
.pie{border-top:1px solid var(--rule);margin-top:32px;padding-top:16px;padding-bottom:24px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.pie span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* empty */
.vac{padding:56px 22px;text-align:center;border:1px dashed var(--line2);background:var(--alt)}
.vac p{color:var(--dim);max-width:44ch;margin:0 auto;font-size:13px;line-height:1.6}
.vac .hand{color:var(--amb);font-size:24px;margin-bottom:8px}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(15,15,15,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal[data-open="1"]{display:flex}
.modal .box{background:var(--bg);border:1px solid var(--ink);padding:26px;max-width:440px;width:100%}
.modal h3{margin:0 0 6px;font-family:var(--arch);font-weight:600;font-size:20px}
.modal p{font-size:12px;line-height:1.5;color:var(--dim);margin:0 0 16px}
.modal .row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.modal .row label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.modal .row input{background:var(--bg);border:1px solid var(--ink);padding:10px 12px;font-family:var(--mono);font-size:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

/* mobile menu */
.menu{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;flex-direction:column;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.menu[data-open="1"]{display:flex}
.menu .mh{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;
  border-bottom:1px solid var(--ink);margin-bottom:18px}
.menu ol{list-style:none;margin:0;padding:0}
.menu li{border-bottom:1px solid var(--line)}
.menu li button{display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;text-align:left;padding:8px 0}
.menu li .t{font-family:var(--arch);font-size:22px;font-weight:500;letter-spacing:-.01em}
.menu li .d{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.menu li button[aria-current="true"] .t{color:var(--mus)}

/* responsive */
@media (max-width:960px){
  .hoy-grid{grid-template-columns:1fr}
  .sem-analisis{grid-template-columns:1fr}
  .metricas{grid-template-columns:1fr 1fr}
  .editor-inner{grid-template-columns:1fr}
  .sliders{grid-template-columns:1fr}
  .wtable .cab,.wrow .grid{grid-template-columns:80px minmax(0,1fr) auto 44px;gap:8px;padding:12px}
  .wtable .cab span:nth-child(3),.wtable .cab span:nth-child(4),
  .wrow .grid .rec,.wrow .grid .zn{display:none}
  .rrow .grid{grid-template-columns:24px minmax(0,1fr) auto 44px;gap:8px;padding:12px 14px}
  .rrow .rec{display:none}
  .rdetail{grid-template-columns:1fr!important;padding:16px}
  .rec-form,.rec-item{grid-template-columns:1fr}
  .rec-item .best-lab,.rec-item .best{text-align:left}
  .tabs{display:none}
  .burger{display:flex}

<script>
/* =====================================================================
   UMBRAL · registro personal · v3 (blanco / mostaza / wordmark D)
   ===================================================================== */

const CFG = { RACE:'2026-12-12', THR:67, DEFAULT_REPO:'nataliamartinsegovia-dotcom/UMBRAL' };
const DASH = '—';
const $ = id => document.getElementById(id);
const esc = s => (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn = n => String(n).padStart(2,'0');
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = v => v==null ? null : Math.round(v*10)/10;

const D = iso => new Date(iso+'T00:00:00Z');
const hoyISO = () => new Date().toISOString().slice(0,10);
const HOY = hoyISO();
const THR = CFG.THR;
const fd = (iso,o) => D(iso).toLocaleDateString('es-ES',{timeZone:'UTC',...(o||{day:'2-digit',month:'short'})}).replace('.','');
const addD = (iso,n) => { const d=D(iso); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const lunesDe = iso => { const d=D(iso); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10); };

const DISC_LIST = ['Crossfit','Hyrox','Carrera','Gimnásticos','Fuerza','Movilidad','Descanso'];
const DIAS_LABEL = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const NAV = [
  ['hoy','HOY','Estado, techo y sesión'],
  ['semana','SEMANA','Plantilla y análisis'],
  ['registro','REGISTRO','Buscar sesiones'],
  ['records','RÉCORDS','Marcas personales'],
];

let DIAS = [], PLANES = [], RECORDS = [], S = [], byDate = new Map();
let tabActiva = 'hoy';
let sucio = false;
let semAct = lunesDe(HOY);
let anioAct = D(semAct).getUTCFullYear();

/* ===== iconos ===== */
const IC = {
  hoy:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14 Q7 11 12 12 T21 8"/><line x1="3" y1="14" x2="21" y2="14" stroke-dasharray="2 2"/></svg>`,
  semana:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="17"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></svg>`,
  registro:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
  records:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4 L6 20 L12 15 L18 20 L18 4"/></svg>`,
  vfc:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,13 8,13 10,7 13,19 15,13 21,13"/></svg>`,
  sueno:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 14 A7 7 0 1 1 10 6 A5 5 0 0 0 18 14 Z"/></svg>`,
  carga:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="12"/><line x1="4" y1="12" x2="20" y2="12"/></svg>`,
  rec:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14 Q7 11 12 12 T21 8"/><line x1="3" y1="14" x2="21" y2="14" stroke-dasharray="2 2"/></svg>`,
  caret:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="transition:transform .2s"><polyline points="6,9 12,15 18,9"/></svg>`,
  lupa:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`,
};

/* ===== carga ===== */
async function cargar(){
  const j = async p => { try{ const r = await fetch(p,{cache:'no-store'}); return r.ok ? await r.json() : null; } catch(e){ return null; } };
  DIAS = (await j('data/index.json')) || [];
  PLANES = (await j('data/planes.json')) || [];
  RECORDS = (await j('data/records.json')) || [];
  if(!DIAS.length){
    const m = await j('data/manifest.json');
    if(Array.isArray(m)){ const res = await Promise.all(m.map(d => j(`data/${d}.json`))); DIAS = res.filter(Boolean); }
  }
  DIAS = DIAS.filter(d=>d && d.date).sort((a,b)=>b.date.localeCompare(a.date));
  byDate = new Map(DIAS.map(d=>[d.date,d]));
  const ultima = DIAS[0];
  if(ultima) $('syncLabel').textContent = 'WHOOP · ' + fd(ultima.date, {day:'2-digit',month:'short'});
  construirSesiones();
  $('pieR').textContent = S.length + ' SESIONES · ' + Math.max(0,Math.ceil((D(CFG.RACE)-D(HOY))/86400000)) + ' DÍAS A LA CARRERA';
}
function discDe(w){
  if(!w) return null;
  const s = (w.sport_name||'').toLowerCase();
  if(s.includes('running')) return 'Carrera';
  if(s.includes('walking')||s.includes('hiking')) return 'Caminar';
  if(s.includes('weightlifting')||s.includes('strength')) return 'Fuerza';
  if(s.includes('functional')) return 'Crossfit';
  if(s.includes('hiit')) return 'Hyrox';
  if(s.includes('yoga')||s.includes('pilates')) return 'Movilidad';
  if(s.includes('cycling')||s.includes('bik')) return 'Bici';
  if(s.includes('rowing')) return 'Remo';
  return w.sport_name || null;
}
function construirSesiones(){
  const plan = new Map();
  PLANES.forEach(p => Object.entries(p.dias||{}).forEach(([iso,e]) => plan.set(iso,e)));
  const fechas = new Set([...plan.keys(), ...DIAS.filter(d=>(d.workouts||[]).length).map(d=>d.date)]);
  S = [...fechas].map(iso => {
    const pl = plan.get(iso) || {};
    const d = byDate.get(iso) || {};
    const ws = d.workouts || [];
    const cats = [];
    if(pl.zona_objetivo) cats.push('Z'+pl.zona_objetivo);
    if(pl.rpe) cats.push('RPE '+pl.rpe);
    const min = ws.reduce((s,w)=>s+(w.duration_min||0),0) || pl.duracion_prevista || 0;
    if(min) cats.push(min+' min');
    return {
      fecha:iso, titulo: pl.titulo || (ws.map(w=>w.sport_name).filter(Boolean).join(' + ') || 'Sesión Whoop'),
      disciplina: pl.disciplina || discDe(ws[0]) || DASH, cats,
      desc: pl.descripcion||'', metricas: pl.metricas||'', sensaciones: pl.sensaciones||'',
      resultado: pl.resultado||'', rpe: pl.rpe||null, zona_obj: pl.zona_objetivo||null,
      rec: d.recovery_score ?? null, hrv: d.hrv_rmssd_milli ?? null,
      strain: d.day_strain ?? null, sueno: d.sleep_performance_percentage ?? null,
      workouts: ws, hecho: ws.length>0, planificado: !!pl.titulo, min,
    };
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function rango(desde,hasta){
  const out=[]; let c=desde, g=0;
  while(c<=hasta && g++<400){ out.push(byDate.get(c) ? {...byDate.get(c)} : {date:c}); const sig=addD(c,1); if(sig===c) break; c=sig; }
  return out;
}
function tensionEn(iso){
  const ag = rango(addD(iso,-6), iso).map(d=>d.day_strain).filter(v=>v!=null);
  const cr = rango(addD(iso,-27), iso).map(d=>d.day_strain).filter(v=>v!=null);
  const mA = mean(ag), mC = mean(cr);
  if(mA==null || !mC) return null;
  return mA/mC;
}

/* ===== nav ===== */
function renderTabs(){
  $('tabs').innerHTML = NAV.map(([id,l])=>`
    <button data-tab="${id}" aria-current="${tabActiva===id}">
      <span class="tab-letter">${'ABCD'[NAV.findIndex(n=>n[0]===id)]}</span>
      <span class="tab-label">${l}</span>
    </button>`).join('');
  $('mlist').innerHTML = NAV.map(([id,l,d])=>`
    <li><button data-tab="${id}" aria-current="${tabActiva===id}">
      <span><span class="t">${l}</span><span class="d">${d}</span></span>
      <span class="mono">→</span>
    </button></li>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = () => { tabActiva=b.dataset.tab; $('menu').dataset.open='0'; render(); };
  });
}
function render(){
  renderTabs();
  ({hoy:vHoy, semana:vSemana, registro:vRegistro, records:vRecords}[tabActiva])();
}

/* ===== HOY ===== */
function vHoy(){
  const d = byDate.get(HOY) || {};
  const s = S.find(x=>x.fecha===HOY);
  const rec = d.recovery_score;
  const cruzado = rec != null && rec >= THR;
  const badge = rec==null
    ? `<span class="badge b-none">SIN LECTURA HOY</span>`
    : cruzado
      ? `<span class="badge b-over">SOBRE UMBRAL · ${rec}%</span>`
      : `<span class="badge b-under">BAJO UMBRAL · ${rec}%</span>`;

  const ultimos = DIAS.slice(0,30).reverse().map(x=>x.recovery_score);
  const graf = graficoLinea(ultimos, THR);

  $('main').innerHTML = `
    <div class="hd">
      <div>
        <div class="t-micro">${fd(HOY,{weekday:'long',day:'2-digit',month:'long'}).toUpperCase()}</div>
        <h1 class="t-h2" style="margin-top:6px">Estado de hoy</h1>
      </div>
      <div style="text-align:right">
        <div class="t-micro">Techo fisiológico</div>
        <div class="t-h3" style="color:var(--amb);margin-top:4px">${cruzado?'Sobre':'Bajo'} umbral · 67%</div>
      </div>
    </div>

    <div class="hoy-grid">
      <div class="hoy-cell">
        <div class="head">${IC.rec}<span class="t-label">Recuperación · Whoop</span></div>
        <div class="t-h1 num">${rec??DASH}${rec!=null?'<small style="font-size:.36em;font-weight:400">%</small>':''}</div>
        ${badge}
        ${rec!=null?`<div style="margin-top:14px;display:flex;align-items:center;gap:10px">
          <div class="hand">${cruzado?'buen día · aprieta con cabeza':'hoy toca calma · zona máx 3'}</div>
        </div>`:''}
      </div>
      <div class="hoy-cell alt">
        <div class="stack">
          <div class="hoy-metric">
            <span class="lab">${IC.vfc}<span class="t-label">VFC</span></span>
            <span class="t-num-md num">${d.hrv_rmssd_milli??DASH}${d.hrv_rmssd_milli!=null?'<small style="font-family:var(--mono);font-size:.42em;color:var(--dim);margin-left:4px">ms</small>':''}</span>
          </div>
          <div class="hoy-metric">
            <span class="lab">${IC.sueno}<span class="t-label">Sueño</span></span>
            <span class="t-num-md num">${d.sleep_performance_percentage??DASH}${d.sleep_performance_percentage!=null?'<small style="font-family:var(--mono);font-size:.42em;color:var(--dim);margin-left:4px">%</small>':''}</span>
          </div>
          <div class="hoy-metric">
            <span class="lab">${IC.carga}<span class="t-label">Carga día</span></span>
            <span class="t-num-md num">${d.day_strain!=null?r1(d.day_strain):DASH}</span>
          </div>
          <div class="hoy-metric">
            <span class="lab"><span class="t-label">FC reposo</span></span>
            <span class="t-num-md num">${d.resting_heart_rate??DASH}${d.resting_heart_rate!=null?'<small style="font-family:var(--mono);font-size:.42em;color:var(--dim);margin-left:4px">bpm</small>':''}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="line-chart">
      <div class="head">
        <span class="t-label">Recuperación contra umbral · 30 días</span>
        <span class="t-micro">Puntos ámbar = sobre umbral</span>
      </div>
      ${graf}
    </div>

    ${s ? `<div class="sesion-hoy" style="margin-top:2px">
      <div>
        <div class="t-micro">Sesión de hoy · ${esc(s.disciplina)}</div>
        <div class="t-h2" style="margin-top:6px">${esc(s.titulo)}</div>
        ${s.desc?`<div class="t-body dim" style="margin-top:6px;max-width:520px">${esc(s.desc)}</div>`:''}
      </div>
      <div class="t-num-lg">${s.min||DASH}<small style="font-family:var(--mono);font-size:.28em;color:var(--dim);margin-left:6px">MIN</small></div>
    </div>` : `<div class="sesion-hoy vacio" style="margin-top:2px;justify-content:center">
      <div style="text-align:center">
        <div class="t-micro">Sin sesión planificada para hoy</div>
        <div class="t-h3" style="margin-top:6px">Ir a <a href="#" onclick="tabActiva='semana';render();return false" style="color:var(--amb)">Semana</a> y planificar el día</div>
      </div>
    </div>`}
  `;
}

function graficoLinea(vals, thr){
  const w = 800, h = 140;
  const vMax = 100, vMin = 0;
  const pts = vals.map((v,i)=>{
    const x = vals.length>1 ? (i/(vals.length-1))*w : w/2;
    const y = v==null ? null : h - ((v-vMin)/(vMax-vMin))*(h-16) - 8;
    return {x,y,v};
  });
  const path = pts.filter(p=>p.y!=null).map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const thrY = h - ((thr-vMin)/(vMax-vMin))*(h-16) - 8;
  const dots = pts.filter(p=>p.y!=null && p.v>=thr).map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--mus)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">
    <line x1="0" y1="${thrY}" x2="${w}" y2="${thrY}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="4" y="${thrY-6}" font-family="JetBrains Mono" font-size="9" fill="var(--ink)">UMBRAL ${thr}</text>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    ${dots}
  </svg>`;
}

/* ===== SEMANA ===== */
function marcarSucio(){ sucio = true; const m=$('msgGuardar'); if(m){ m.textContent='SIN GUARDAR'; m.classList.add('dirty'); } }
function semanasDelAnio(anio){
  const out=[]; let m = lunesDe(`${anio}-01-01`);
  for(let i=0;i<53;i++){ if(D(m).getUTCFullYear()>anio && i>0) break; out.push(m); m = addD(m,7); }
  return out;
}
function semanaObj(lunes){
  let wk = PLANES.find(p=>p.semana===lunes);
  if(!wk){ wk = {semana:lunes, bloque:'Bloque 1', foco:'', dias:{}};
    for(let i=0;i<7;i++) wk.dias[addD(lunes,i)] = {};
    PLANES.push(wk); PLANES.sort((a,b)=>b.semana.localeCompare(a.semana)); }
  for(let i=0;i<7;i++){ const iso=addD(lunes,i); if(!wk.dias[iso]) wk.dias[iso]={}; }
  return wk;
}
function metricasSemana(lunes){
  const dias = rango(lunes, addD(lunes,6));
  const conRec = dias.filter(d=>d.recovery_score!=null);
  const recMedia = conRec.length ? mean(conRec.map(d=>d.recovery_score)) : null;
  const planE = PLANES.find(p=>p.semana===lunes);
  let plan=0, hecho=0;
  dias.forEach(d=>{
    const e = planE && planE.dias ? planE.dias[d.date] : null;
    if(e && e.titulo && e.disciplina!=='Descanso'){ plan++; if((d.workouts||[]).length) hecho++; }
  });
  const t = tensionEn(addD(lunes,6));
  const totalMin = dias.reduce((s,d)=>s+((d.workouts||[]).reduce((x,w)=>x+(w.duration_min||0),0)),0);
  return {
    recMedia: recMedia!=null?Math.round(recMedia):null,
    adherencia: plan ? `${hecho}/${plan}` : DASH,
    adherenciaPct: plan ? Math.round(hecho/plan*100) : null,
    tension: t!=null ? r1(t) : null,
    totalMin,
  };
}
function vSemana(){
  const wk = semanaObj(semAct);
  const met = metricasSemana(semAct);
  const semanas = semanasDelAnio(anioAct);
  const idxSel = semanas.indexOf(semAct);

  const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const mesesHtml = MESES.map((m,i)=>{
    const primer = semanas.find(s => D(s).getUTCMonth()===i || D(addD(s,6)).getUTCMonth()===i);
    const activo = D(semAct).getUTCMonth()===i;
    return `<button class="mes ${activo?'on':''}" data-jump="${primer||''}">${m}</button>`;
  }).join('');

  const densidad = semanas.map((s,i)=>{
    const m = metricasSemana(s);
    let clase='';
    if(m.recMedia!=null) clase = m.recMedia>=THR ? 'hi' : 'md';
    return `<button class="${clase} ${i===idxSel?'sel':''}" data-jump="${s}" title="${fd(s)} · ${m.recMedia??'-'}%" aria-label="Semana ${i+1}"></button>`;
  }).join('');

  const dias = Array.from({length:7},(_,i)=>addD(semAct,i));
  const filas = dias.map((iso,i)=>{
    const e = wk.dias[iso];
    const dia = byDate.get(iso) || {};
    const futuro = iso > HOY;
    const hecho = (dia.workouts||[]).length > 0;
    const rec = dia.recovery_score;
    let estado, claseEstado, dotColor;
    if(futuro){ estado = e.titulo?'PENDIENTE':'SIN PLAN'; claseEstado = e.titulo?'pend':'sinplan'; }
    else if(hecho){ estado = 'HECHA'; claseEstado='hecha'; }
    else if(e.titulo){ estado = 'NO HECHA'; claseEstado='nohecha'; }
    else { estado = '—'; claseEstado='sinplan'; }
    return `<div class="wrow ${i===0?'first':''} ${iso===HOY?'hoy':''}" data-iso="${iso}" aria-expanded="false" tabindex="0" role="button">
        <div class="grid">
          <div class="dia">${DIAS_LABEL[i]} ${nn(D(iso).getUTCDate())}${iso===HOY?'<small>· HOY</small>':''}</div>
          <div class="tit">
            ${e.titulo?esc(e.titulo):'<span class="empty">— sin planificar —</span>'}
            ${e.disciplina?`<span class="sub">${esc(e.disciplina)}${e.rpe?` · RPE ${e.rpe}`:''}</span>`:''}
          </div>
          <div class="rec">${rec??DASH}${rec!=null?'<small style="color:var(--dim);font-family:var(--mono);font-size:9px;margin-left:2px">%</small>':''}</div>
          <div class="zn">${e.zona_objetivo?'Z'+e.zona_objetivo:'<span class="dim">·</span>'}</div>
          <div class="est ${claseEstado}"><span class="dot"></span>${estado}</div>
          <div class="caret">${IC.caret}</div>
        </div>
      </div>
      <div class="editor" data-ed="${iso}"></div>`;
  }).join('');

  $('main').innerHTML = `
    <div class="hd">
      <div>
        <div class="t-micro">Plantilla y análisis</div>
        <h1 class="t-h2" style="margin-top:6px">Semana</h1>
      </div>
      <div style="text-align:right">
        <div class="t-micro">Hyrox Madrid</div>
        <div class="t-h3" style="color:var(--amb);margin-top:4px">${Math.max(0,Math.ceil((D(CFG.RACE)-D(HOY))/86400000))} días</div>
      </div>
    </div>

/* ===== REGISTRO ===== */
const stReg = { disc:new Set(), umbral:null, texto:'', desde:'', hasta:'' };
function matchReg(s){
  if(stReg.disc.size && !stReg.disc.has(s.disciplina)) return false;
  if(stReg.umbral){ const r=s.rec; if(r==null) return false;
    if(stReg.umbral==='over' && r<THR) return false;
    if(stReg.umbral==='under' && r>=THR) return false; }
  if(stReg.desde && s.fecha < stReg.desde) return false;
  if(stReg.hasta && s.fecha > stReg.hasta) return false;
  if(stReg.texto){
    const q = stReg.texto.toLowerCase();
    const hay = [s.titulo,s.desc,s.metricas,s.sensaciones,s.disciplina,s.resultado].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function vRegistro(){
  const dc = new Map(); S.forEach(s=>dc.set(s.disciplina,(dc.get(s.disciplina)||0)+1));
  const m = S.filter(matchReg);
  $('main').innerHTML = `
    <div class="hd">
      <div>
        <div class="t-micro">Histórico buscable</div>
        <h1 class="t-h2" style="margin-top:6px">Registro</h1>
      </div>
      <div class="t-label">${m.length} DE ${S.length}</div>
    </div>

    <div class="buscador">
      ${IC.lupa}
      <input type="text" id="busq" placeholder="Buscar por texto: Fran, sled, thrusters…" value="${esc(stReg.texto)}">
    </div>

    <div class="filtros" id="filtros">
      ${dc.size?[...dc.entries()].sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<button class="chip" data-d="${esc(n)}"
        aria-pressed="${stReg.disc.has(n)}">${esc(n)} · ${c}</button>`).join(''):''}
      <button class="chip" data-u="over" aria-pressed="${stReg.umbral==='over'}">Sobre umbral</button>
      <button class="chip" data-u="under" aria-pressed="${stReg.umbral==='under'}">Bajo umbral</button>
      <span class="rango"><label class="t-micro">Desde</label><input type="date" id="fdesde" value="${stReg.desde}"></span>
      <span class="rango"><label class="t-micro">Hasta</label><input type="date" id="fhasta" value="${stReg.hasta}"></span>
      ${(stReg.disc.size||stReg.umbral||stReg.desde||stReg.hasta||stReg.texto)?'<button class="chip" id="flimpiar">Limpiar</button>':''}
    </div>

    <div class="rlista" id="lista"></div>
  `;

  const lista = $('lista');
  if(!m.length){
    lista.innerHTML = `<div class="vac"><div class="hand">nada aún</div><p>No hay sesiones que coincidan con el filtro, o todavía no se han registrado.</p></div>`;
  } else {
    m.slice(0,120).forEach((s,i)=>{
      const rec = s.rec;
      const w = (s.workouts||[])[0];
      const row = document.createElement('div');
      row.innerHTML = `<div class="rrow ${i===0?'first':''}" data-i="${i}" aria-expanded="false" role="button" tabindex="0">
          <div class="grid">
            <div class="disc-dot"></div>
            <div class="t">${esc(s.titulo)}<span class="sub">${esc(s.disciplina)} · ${s.cats.map(esc).join(', ')||DASH}</span></div>
            <div class="rec">${rec!=null?`<b>${rec}</b>%`:DASH}</div>
            <div class="fecha">${fd(s.fecha)}</div>
            <div class="caret">${IC.caret}</div>
          </div>
        </div>
        <div class="rdetail">
          <div class="prose">
            ${s.desc?`<span class="k">Descripción</span><p>${esc(s.desc)}</p>`:''}
            ${s.resultado?`<span class="k">Resultado</span><p>${esc(s.resultado)}</p>`:''}
            ${s.metricas?`<span class="k">Métricas</span><p>${esc(s.metricas)}</p>`:''}
            ${s.sensaciones?`<span class="k">Sensaciones</span><p class="dim">${esc(s.sensaciones)}</p>`:''}
            ${!s.desc&&!s.metricas&&!s.sensaciones&&!s.resultado?'<p class="dim">Sin anotación en esta sesión.</p>':''}
          </div>
          <div class="detail-panel">
            <h4>${IC.rec}Datos Whoop</h4>
            <table class="spec">
              <tr><td>Recuperación</td><td>${s.rec??DASH}${s.rec!=null?' %':''}</td></tr>
              <tr><td>VFC</td><td>${s.hrv??DASH}${s.hrv!=null?' ms':''}</td></tr>
              <tr><td>Sueño</td><td>${s.sueno??DASH}${s.sueno!=null?' %':''}</td></tr>
              <tr><td>Carga del día</td><td>${s.strain!=null?r1(s.strain):DASH}</td></tr>
              ${s.zona_obj?`<tr><td>Zona objetivo</td><td>Z${s.zona_obj}</td></tr>`:''}
              ${s.rpe?`<tr><td>Esfuerzo</td><td>RPE ${s.rpe}</td></tr>`:''}
              ${w?`<tr><td>${esc((w.sport_name||'sesión').toUpperCase())}</td><td>${w.duration_min??DASH} min · FC ${w.average_heart_rate??DASH}</td></tr>`:''}
            </table>
          </div>
        </div>`;
      lista.appendChild(row);
    });
    lista.onclick = ev => {
      const b = ev.target.closest('[data-i]'); if(!b) return;
      const abierto = b.getAttribute('aria-expanded')==='true';
      lista.querySelectorAll('[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));
      if(!abierto) b.setAttribute('aria-expanded','true');
    };
  }

  let deb;
  $('busq').oninput = ev => { clearTimeout(deb); const v=ev.target.value; deb = setTimeout(()=>{ stReg.texto=v.trim(); vRegistro(); }, 200); };
  $('fdesde').onchange = ev => { stReg.desde = ev.target.value; vRegistro(); };
  $('fhasta').onchange = ev => { stReg.hasta = ev.target.value; vRegistro(); };
  $('filtros').onclick = ev => {
    const bd = ev.target.closest('[data-d]'), bu = ev.target.closest('[data-u]'), bl = ev.target.closest('#flimpiar');
    if(bd){ stReg.disc.has(bd.dataset.d) ? stReg.disc.delete(bd.dataset.d) : stReg.disc.add(bd.dataset.d); }
    if(bu){ stReg.umbral = stReg.umbral===bu.dataset.u ? null : bu.dataset.u; }
    if(bl){ stReg.disc.clear(); stReg.umbral=null; stReg.desde=''; stReg.hasta=''; stReg.texto=''; }
    if(bd||bu||bl) vRegistro();
  };
}

/* ===== RÉCORDS ===== */
const TIPOS = {
  tiempo:   { lbl:'Tiempo (mm:ss)', menorMejor:true,  parse:v=>{ const m=v.match(/^(\d+):(\d{1,2})$/); return m?+m[1]*60+ +m[2]:null; }, fmt:v=>`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}` },
  numero:   { lbl:'Número', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>String(v) },
  distancia:{ lbl:'Distancia (km)', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} km` },
  peso:     { lbl:'Peso (kg)', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} kg` },
  rondas:   { lbl:'Rondas', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} rondas` },
};
let mostrarFormNuevo = false, editandoHist = null;
function vRecords(){
  $('main').innerHTML = `
    <div class="hd">
      <div>
        <div class="t-micro">Marcas personales</div>
        <h1 class="t-h2" style="margin-top:6px">Récords</h1>
      </div>
      <button class="btn" id="btnNuevo">+ Nuevo récord</button>
    </div>

    <div id="formNuevo" class="rec-form ${mostrarFormNuevo?'':'hide'}">
      <div class="form-row"><label>Disciplina</label>
        <select id="fDisc">${DISC_LIST.filter(d=>d!=='Descanso').map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div class="form-row"><label>Nombre</label>
        <input type="text" id="fNom" placeholder="5k, Fran, sentadilla…"></div>
      <div class="form-row"><label>Tipo</label>
        <select id="fTipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v.lbl}</option>`).join('')}</select></div>
      <div class="full" style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn ghost" id="fCancel">Cancelar</button>
        <button class="btn" id="fCrear">Crear récord</button>
      </div>
    </div>

    <div id="listaRec"></div>

    <div class="acc-bar">
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="btnGuardar">Guardar en GitHub</button>
        <button class="btn ghost" id="btnAcceso">Acceso</button>
      </span>
      <span class="msg ${sucio?'dirty':''}" id="msgGuardar">${sucio?'SIN GUARDAR':'GUARDADO'}</span>
    </div>
  `;

  const lista = $('listaRec');
  if(!RECORDS.length){
    lista.innerHTML = `<div class="vac"><div class="hand">crea tu primer récord</div>
      <p>Puede ser tu mejor 5K, la carga máxima en peso muerto, la sesión más larga en Z2. Lo que quieras seguir en el tiempo.</p></div>`;
  } else {
    RECORDS.forEach((rec,i)=>{
      const t = TIPOS[rec.tipo];
      const h = [...(rec.historial||[])].sort((a,b)=> t.menorMejor ? a.valor-b.valor : b.valor-a.valor);
      const best = h[0];
      const cronologico = [...(rec.historial||[])].sort((a,b)=>a.fecha.localeCompare(b.fecha));
      const box = document.createElement('div');
      box.className = 'rec-item';
      box.innerHTML = `
        <div>
          <div class="disc">${esc(rec.disciplina||'')} · ${esc(t.lbl)}</div>
          <div class="nom">${esc(rec.nombre||'—')}</div>
        </div>
        <div>
          <div class="best-lab">Mejor marca</div>
          <div class="best">${best?t.fmt(best.valor):DASH}</div>
        </div>
        ${cronologico.length ? `<div class="history">
          <h5>Historial · ${cronologico.length} intento${cronologico.length===1?'':'s'}</h5>
          <div class="hist-list">
            ${cronologico.slice().reverse().map(h=>`<div class="h"><span>${fd(h.fecha)}${h.nota?' · '+esc(h.nota):''}</span><b style="font-family:var(--arch);color:var(--ink);font-weight:600">${t.fmt(h.valor)}</b></div>`).join('')}
          </div>
        </div>` : ''}
        <div class="add-btn" style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="text" data-add-val="${i}" placeholder="${t.lbl}" style="flex:1;background:var(--bg);border:1px solid var(--ink);padding:9px 10px;font-family:var(--mono);font-size:12px;min-width:120px">
          <input type="date" data-add-date="${i}" value="${HOY}" style="background:var(--bg);border:1px solid var(--ink);padding:9px 10px;font-family:var(--mono);font-size:11px">
          <button class="btn ghost" data-add="${i}">+ Añadir intento</button>
          <button class="btn ghost" data-del="${i}" style="border-color:#B24C1C;color:#B24C1C" title="Borrar récord">Borrar</button>
        </div>`;
      lista.appendChild(box);
    });
    lista.onclick = ev => {
      const ba = ev.target.closest('[data-add]');
      const bd = ev.target.closest('[data-del]');
      if(ba){
        const i = +ba.dataset.add;
        const val = lista.querySelector(`[data-add-val="${i}"]`).value.trim();
        const fecha = lista.querySelector(`[data-add-date="${i}"]`).value || HOY;
        if(!val) return;
        const t = TIPOS[RECORDS[i].tipo];
        const parsed = t.parse(val);
        if(parsed==null || isNaN(parsed)) return alert('Valor no válido para '+t.lbl);
        RECORDS[i].historial = RECORDS[i].historial || [];
        RECORDS[i].historial.push({fecha, valor:parsed});
        marcarSucio(); vRecords();
      }
      if(bd){
        if(!confirm('¿Borrar este récord y su historial?')) return;
        RECORDS.splice(+bd.dataset.del,1); marcarSucio(); vRecords();
      }
    };
  }

  $('btnNuevo').onclick = () => { mostrarFormNuevo = !mostrarFormNuevo; vRecords(); };
  const fn = $('formNuevo');
  if(!fn.classList.contains('hide')){
    $('fCancel').onclick = () => { mostrarFormNuevo=false; vRecords(); };
    $('fCrear').onclick = () => {
      const nom = $('fNom').value.trim();
      if(!nom) return alert('Ponle un nombre');
      RECORDS.push({disciplina:$('fDisc').value, nombre:nom, tipo:$('fTipo').value, historial:[]});
      mostrarFormNuevo = false; marcarSucio(); vRecords();
    };
  }
  $('btnGuardar').onclick = guardarTodo;
  $('btnAcceso').onclick = pedirAcceso;
}

/* ===== GitHub save ===== */
async function guardarTodo(){
  const tk = localStorage.getItem('umbral.token');
  const repo = localStorage.getItem('umbral.repo') || CFG.DEFAULT_REPO;
  if(!tk){ pedirAcceso(); return; }
  const m = $('msgGuardar'); if(m){ m.textContent='GUARDANDO…'; m.classList.remove('dirty'); }
  try{
    await ghPutFile(repo, tk, 'data/planes.json', JSON.stringify(PLANES,null,2));
    await ghPutFile(repo, tk, 'data/records.json', JSON.stringify(RECORDS,null,2));
    sucio = false;
    if(m){ m.textContent='GUARDADO'; }
  }catch(e){
    if(m){ m.textContent='ERROR: '+e.message; m.classList.add('dirty'); }
    alert('No se pudo guardar: '+e.message);
  }
}
async function ghPutFile(repo, token, path, content){
  const url = `https://api.github.com/repos/${repo}/contents/${path}`;
  const shaResp = await fetch(url, {headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'}});
  const sha = shaResp.ok ? (await shaResp.json()).sha : undefined;
  const body = {
    message: `umbral: actualizar ${path.split('/').pop()}`,
    content: btoa(unescape(encodeURIComponent(content))),
    ...(sha?{sha}:{}),
  };
  const r = await fetch(url, {method:'PUT', headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'}, body:JSON.stringify(body)});
  if(!r.ok){ const err = await r.json().catch(()=>({message:r.statusText})); throw new Error(err.message||r.statusText); }
}
function pedirAcceso(){
  $('tokenInput').value = localStorage.getItem('umbral.token') || '';
  $('repoInput').value = localStorage.getItem('umbral.repo') || CFG.DEFAULT_REPO;
  $('tokenModal').dataset.open='1';
}

/* ===== bootstrap ===== */
$('burger').onclick = () => { $('menu').dataset.open='1'; };
$('burger2').onclick = () => { $('menu').dataset.open='0'; };
$('tokenCancel').onclick = () => { $('tokenModal').dataset.open='0'; };
$('tokenSave').onclick = () => {
  localStorage.setItem('umbral.token', $('tokenInput').value.trim());
  localStorage.setItem('umbral.repo', $('repoInput').value.trim() || CFG.DEFAULT_REPO);
  $('tokenModal').dataset.open='0';
};

cargar().then(render);
</script>
