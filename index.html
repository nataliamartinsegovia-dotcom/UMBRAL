<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<meta name="theme-color" content="#0d0d0d">
<title>Umbral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d; --panel:#151515; --line:#262626; --lineHi:#3a3a3a;
  --tx:#ffffff; --dim:#8a8a8a; --dimmer:#5c5c5c;
  --lima:#EBFA64; --violeta:#160635; --violetaTx:#BFB9DA; --violetaLine:#3a2a66;
  --rojo:#E72C5B; --azul:#1360F9; --morado:#8A7CF9;
  --disp:'Archivo',sans-serif; --mono:'Space Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:var(--disp); -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono);letter-spacing:.02em}
.cond{font-stretch:condensed}
.dim{color:var(--dim)}
a{color:var(--azul)}
::selection{background:var(--lima);color:#0d0d0d}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}

/* A sangre completa: nada de tope de ancho con huecos negros a los lados.
   El margen crece con la pantalla en vez de dejar un lienzo fijo centrado. */
.app{width:100%;background:var(--bg);min-height:100vh}
.top,.pad,.pie{padding-left:clamp(24px,4vw,64px);padding-right:clamp(24px,4vw,64px)}

/* ===== masthead ===== */
.top{padding-top:20px;padding-bottom:20px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);gap:16px}
.wmwrap{display:flex;align-items:center;gap:10px}
.wmwrap svg{width:22px;height:22px;flex-shrink:0}
.wm{font-family:var(--disp);font-size:clamp(20px,2vw,26px);font-weight:900;
  letter-spacing:.05em;line-height:1}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.02em;padding:6px 0;
  border-bottom:2px solid transparent;color:var(--dim);white-space:nowrap;flex-shrink:0}
.tabs button[aria-current="true"]{color:#fff;border-bottom-color:#fff}
.burger{display:none;width:40px;height:40px;align-items:center;justify-content:center;
  flex-shrink:0;border:1px solid var(--line)}
.burger i{display:block;width:16px;height:1px;background:#fff;position:relative}
.burger i::before,.burger i::after{content:'';position:absolute;left:0;width:16px;height:1px;background:#fff}
.burger i::before{top:-5px}.burger i::after{top:5px}

/* ===== panel base ===== */
.pad{padding-top:32px;padding-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;
  flex-wrap:wrap;gap:8px}
.hd h1{font-size:28px;font-weight:900;margin:0}
.hd .sub{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ===== SEMANA: dateline anual ===== */
.datebox{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.datenav button{width:28px;height:28px;border:1px solid var(--line);background:none;color:#fff;flex-shrink:0}
.datenav .anioLbl{font-size:11px;color:var(--dim);flex-shrink:0}
.meses{display:flex;flex:1;gap:2px;overflow-x:auto}
.mes{flex:1;text-align:center;padding:6px 2px;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
.mes.on{color:#fff;border-bottom-color:var(--lima);font-weight:700}
.densidad{display:flex;gap:1px;height:22px;margin-bottom:6px}
.densidad>div{flex:1;background:var(--line);cursor:pointer}
.densidad>div.hi{background:var(--lima)}
.densidad>div.md{background:var(--lima);opacity:.35}
.densidad>div.sel{outline:1px solid #fff;outline-offset:-1px}
.semlabel{font-family:var(--mono);font-size:10px;color:var(--dim)}
.semlabel b{color:#fff}

/* ===== paneles genéricos (análisis semanal, foco, formularios) ===== */
.dos{display:grid;grid-template-columns:1.3fr 1fr;gap:2px}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.metricas .v{font-size:22px;font-weight:900;margin-top:4px}
.barra2{height:4px;background:var(--line);margin-top:6px;position:relative}
.barra2 i{position:absolute;left:0;top:0;bottom:0;display:block}
.fococampo{width:100%;background:#0d0d0d;border:1px solid var(--line);color:#fff;
  padding:9px 10px;font-size:14px}
.fococampo:focus{outline:none;border-color:var(--azul)}

/* ===== registro: buscador y rango de fechas ===== */
.buscador{margin-bottom:10px}
.buscador input{width:100%;background:#1a1a1a;border:1px solid var(--line);color:#fff;
  padding:11px 14px;font-size:14px}
.buscador input:focus{outline:none;border-color:var(--azul)}
.filtros .rango{display:flex;flex-direction:column;gap:3px}
.filtros .rango input[type=date]{background:#1a1a1a;border:1px solid var(--line);color:#fff;
  padding:6px 8px;font-family:var(--mono);font-size:11px;color-scheme:dark}

/* ===== HOY: recuperación + techo ===== */
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:2px}
.card{padding:26px}
.card.lima{background:var(--lima);color:#0d0d0d}
.card.violeta{background:var(--violeta)}
.lbl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.lbl.tx-violeta{color:var(--violetaTx)}
.card svg{display:block;width:100%;height:auto;margin-top:8px}
.recrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;flex-wrap:wrap;gap:6px}
.recrow .n{font-size:clamp(38px,5vw,56px);font-weight:900}
.techo-badge{margin-top:8px;padding:8px 12px;font-size:11px;font-weight:700}
.techo-badge.cruzado{background:var(--rojo);color:#fff}
.techo-badge.dentro{background:var(--azul);color:#fff}
.techo-badge.sindato{background:var(--line);color:var(--dim)}

.sesionhoy{margin-top:2px;background:var(--azul);padding:24px 26px;display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.sesionhoy .tit{font-size:clamp(26px,4vw,38px);font-weight:900;margin-top:2px}
.sesionhoy .min{font-size:clamp(28px,4vw,44px);font-weight:900}
.sesionhoy.vacio{background:var(--panel);border:1px dashed var(--line)}

/* ===== SEMANA: donuts + secuenciador ===== */
.donuts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:24px}
.donut{padding:18px;display:flex;flex-direction:column;align-items:center}
.donut svg{width:90px;height:90px;max-width:100%}
.donut .lbl{margin-top:8px}
.seqrows{display:flex;flex-direction:column;gap:2px}
.seqrow{display:flex;gap:2px;align-items:center}
.seqrow .lb{width:34px;flex-shrink:0;font-family:var(--mono);font-size:8px;color:var(--dim)}
.seqrow .cell{flex:1;height:18px}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.leyenda .it{display:flex;align-items:center;gap:6px}
.leyenda .sw{width:10px;height:10px;display:inline-block;flex-shrink:0}

/* ===== MARCAS ===== */
.marca{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;
  margin-bottom:2px;gap:14px;flex-wrap:wrap}
.marca .disc{font-family:var(--mono);font-size:9px;opacity:.75}
.marca .nom{font-size:26px;font-weight:900}
.marca .old{font-family:var(--mono);font-size:10px;text-decoration:line-through;opacity:.6;text-align:right}
.marca .new{font-size:30px;font-weight:900;text-align:right}
.marca .glifo{width:46px;height:46px;flex-shrink:0}

/* ===== PLAN: sliders ===== */
.campo{max-width:520px;display:flex;flex-direction:column;gap:22px}
.campo .fila .top{font-family:var(--mono);font-size:10px;display:flex;justify-content:space-between;color:var(--dim)}
.campo .fila .top b{color:#fff;font-weight:400}
input[type=range]{width:100%;margin-top:8px;height:20px;-webkit-appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;margin-top:-7px;cursor:pointer}
.chips{display:flex;gap:2px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:8px 14px;background:#1a1a1a;color:#fff}
.chip[aria-pressed="true"]{color:#0d0d0d}
.f2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:18px}
.f2 label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.f2 input[type=text],.f2 textarea,.f2 select{width:100%;background:#1a1a1a;border:1px solid var(--line);
  padding:9px 10px;font-size:14px}
.f2 textarea{min-height:60px;resize:vertical;font-family:inherit}
.f2 input:focus,.f2 textarea:focus,.f2 select:focus{outline:none;border-color:var(--azul)}
.acc{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 0;border-top:1px solid var(--line);margin-top:22px}
.btn{background:var(--azul);color:#fff;padding:11px 18px;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;min-height:44px;display:inline-flex;align-items:center}
.btn.ghost{background:#1a1a1a;border:1px solid var(--line)}
.picker{display:flex;gap:6px}
.picker button{width:38px;height:38px;border:1px solid var(--line);font-family:var(--mono);font-size:12px}
.picker button[aria-pressed="true"]{background:#fff;color:#0d0d0d;border-color:#fff}

/* ===== REGISTRO: lista con glifo ===== */
.filtros{display:flex;gap:2px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:2px}
.reglista{display:flex;flex-direction:column}
.regrow{display:grid;grid-template-columns:46px minmax(0,1fr) 110px 90px 70px;gap:14px;
  align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.regrow:hover{background:#141414}
.regrow .glifo{width:38px;height:38px}
.regrow .t{font-size:16px}
.regrow .t b{font-weight:700}
.regrow .sb{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase}
.regrow .fecha{text-align:right;font-family:var(--mono);font-size:10px;color:var(--dim)}
.regrow .est{text-align:right;font-family:var(--mono);font-size:9px;text-transform:uppercase}
.regrow .est.on{color:var(--rojo);font-weight:700}
.detalle{display:none;padding:16px 4px 22px;background:#111}
.detalle.open{display:grid;grid-template-columns:46px 1fr 1fr;gap:16px 24px}
.detalle .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  display:block;margin-bottom:3px}
.detalle p{font-size:14px;margin-bottom:10px;max-width:54ch}
.spec{width:100%;border-collapse:collapse}
.spec tr{border-bottom:1px solid var(--line)}
.spec td{padding:6px 0;font-size:13px}
.spec td:last-child{text-align:right;font-family:var(--mono)}
.zb{display:flex;height:6px;gap:1px;margin-top:8px}

/* ===== ANÁLISIS ===== */
.analisis-item{padding:20px 22px;border-bottom:1px solid var(--line)}
.analisis-item .tit{font-size:19px;font-weight:700;margin-bottom:4px}
.analisis-item .dt{font-family:var(--mono);font-size:10px;color:var(--dim)}
.barra{position:relative;height:8px;background:var(--line);margin-top:10px}
.barra i{position:absolute;left:0;top:0;bottom:0;display:block}
.barra em{position:absolute;top:-4px;width:2px;height:16px;background:#fff}

.vac{padding:44px 22px;text-align:center}
.vac p{color:var(--dim);max-width:44ch;margin:0 auto;font-size:14px}

.pie{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;padding-bottom:14px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.pie span{font-family:var(--mono);font-size:9px;color:var(--dim)}

/* ===== menú móvil ===== */
.menu{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.menu[data-open="1"]{display:flex}
.menu .mh{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;
  border-bottom:1px solid var(--line);margin-bottom:18px}
.menu ol{list-style:none}
.menu li{border-bottom:1px solid var(--line)}
.menu li button{display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:60px;text-align:left}
.menu li .t{font-size:20px;font-weight:900}
.menu li .d{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
.menu li button[aria-current="true"] .t{color:var(--lima)}

/* ===== responsive real ===== */
@media (max-width:900px){
  .dos{grid-template-columns:1fr}
  .metricas{grid-template-columns:1fr 1fr}
  .meses{overflow-x:auto}
  .mes{flex:0 0 auto;min-width:44px;padding:8px 6px}
  .densidad>div{min-width:4px}
  .datenav button{width:36px;height:36px}
  .buscador input,.fococampo{padding:11px 12px}
  .filtros .rango input[type=date]{min-height:36px}
  .top,.pad,.pie{padding-left:16px;padding-right:16px}
  .top{padding-top:14px;padding-bottom:14px}
  .tabs{display:none}
  .burger{display:flex}
  .pad{padding-top:20px;padding-bottom:10px}
  .hd h1{font-size:22px}
  .grid2{grid-template-columns:1fr}
  .donuts{grid-template-columns:repeat(2,1fr)}
  .sesionhoy{flex-direction:column;align-items:flex-start}
  .regrow{grid-template-columns:36px minmax(0,1fr) auto;gap:4px 10px}
  .regrow .fecha{grid-column:3;grid-row:1}
  .regrow .est{grid-column:3;grid-row:2}
  .regrow .sb{grid-column:2/-1}
  .detalle.open{grid-template-columns:1fr;gap:10px}
  .detalle>span:first-child{display:none}
  .f2{grid-template-columns:1fr}
  .marca{padding:16px 4px}
  .marca .nom{font-size:21px}
  .marca .new{font-size:24px}
  input[type=range]{min-height:44px}
  .chip,.picker button,.btn{min-height:44px}
  .picker button{width:44px}
  .pie{padding:14px 16px}
}

</style>
</head>

<div class="app">
  <div class="top">
    <span class="wmwrap"><svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="none" stroke="#1360F9" stroke-width="1" opacity="0.5"></circle>
      <line x1="20" y1="20" x2="30" y2="10" stroke="#E72C5B" stroke-width="2.5" stroke-linecap="round"></line>
      <circle cx="20" cy="20" r="2.5" fill="#fff"></circle>
    </svg><span class="wm">UMBRAL</span></span>
    <nav class="tabs" id="tabs"></nav>
    <button class="burger" id="burger" aria-label="Menú" aria-expanded="false"><i></i></button>
  </div>
  <main id="main"></main>
  <div class="pie">
    <span>● SYNC WHOOP 08:00</span>
    <span id="totalSesiones"></span>
  </div>
</div>

<div class="menu" id="menu" data-open="0" role="dialog" aria-label="Menú">
  <div class="mh"><span class="wmwrap"><svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="none" stroke="#1360F9" stroke-width="1" opacity="0.5"></circle>
      <line x1="20" y1="20" x2="30" y2="10" stroke="#E72C5B" stroke-width="2.5" stroke-linecap="round"></line>
      <circle cx="20" cy="20" r="2.5" fill="#fff"></circle>
    </svg><span class="wm">UMBRAL</span></span>
    <button class="burger" id="burger2" style="display:flex" aria-label="Cerrar"><i></i></button></div>
  <ol id="mlist"></ol>
</div>

<script>
/* ===================================================================
   UMBRAL RADIAL · motor de dibujo
   =================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const DISC_COLOR = {
  Crossfit:'#E72C5B', Hyrox:'#EBFA64', Carrera:'#1360F9',
  'Gimnásticos':'#BFB9DA', Fuerza:'#8A7CF9', Movilidad:'#8A7CF9',
  Caminar:'#3a3a3a', Bici:'#1360F9', Remo:'#1360F9', 'Natación':'#1360F9',
  Descanso:'#262626',
};
const discColor = d => DISC_COLOR[d] || '#5c5c5c';

function svgEl(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---------- fan chart: recuperación de los últimos N días ---------- */
function fanChart(valores, { thr = 67 } = {}){
  const svg = svgEl('svg', { viewBox:'0 0 260 200' });
  const n = Math.max(valores.length, 1);
  const cx = 130, cy = 190;
  valores.forEach((v, i) => {
    const t = n > 1 ? i/(n-1) : 0.5;
    const angle = Math.PI * (1 - t*0.85 - 0.075);
    const sobre = v != null && v >= thr;
    const len = v == null ? 60 : 60 + Math.max(0, Math.min(100, v)) * 1.15;
    const x = cx + Math.cos(angle) * len * 0.72;
    const y = cy - Math.sin(angle) * len;
    svg.appendChild(svgEl('line', {
      x1:cx, y1:cy, x2:x.toFixed(1), y2:y.toFixed(1),
      stroke:'currentColor', 'stroke-width': sobre ? 2.5 : 1,
      opacity: v == null ? 0.15 : (sobre ? 1 : 0.35),
    }));
  });
  svg.appendChild(svgEl('circle', { cx, cy, r:4, fill:'currentColor' }));
  return svg;
}

/* ---------- brújula del techo: hoy contra el umbral ---------- */
function techoCompass(hoyPct, thr = 67){
  const svg = svgEl('svg', { viewBox:'0 0 260 170' });
  svg.style.overflow = 'visible';
  [30,55,80].forEach(r => svg.appendChild(svgEl('circle',
    { cx:130, cy:90, r, fill:'none', stroke:'#3a2a66', 'stroke-width':1 })));

  const ratio = thr > 0 ? hoyPct/thr : 1;
  const cruzado = hoyPct >= thr;
  const largo = 30 + Math.min(ratio, 1.6) * 50;
  const ang = cruzado ? -0.62 : 2.42; // arriba-derecha si cruza, abajo-izquierda si no
  const x = 130 + Math.cos(ang) * largo, y = 90 + Math.sin(ang) * largo;

  svg.appendChild(svgEl('line', {
    x1:130, y1:90, x2:x.toFixed(1), y2:y.toFixed(1),
    stroke: cruzado ? '#E72C5B' : '#1360F9',
    'stroke-width': cruzado ? 3 : 2, 'stroke-linecap':'round',
    opacity: cruzado ? 1 : 0.7,
  }));
  svg.appendChild(svgEl('circle', { cx:x.toFixed(1), cy:y.toFixed(1), r:6,
    fill: cruzado ? '#E72C5B' : '#1360F9' }));

  const t = svgEl('text', { x:130, y:164, 'text-anchor':'middle', fill:'#7d76a3',
    'font-family':'Space Mono', 'font-size':8 });
  t.textContent = `UMBRAL ${thr} · HOY ${Math.round(ratio*100)}%`;
  svg.appendChild(t);
  return svg;
}

/* ---------- donut: adherencia o reparto por disciplina/zona ---------- */
function donut(pct, { fg = '#fff', track = '#333', size = 90 } = {}){
  const svg = svgEl('svg', { viewBox:'0 0 100 100', width:size, height:size });
  svg.appendChild(svgEl('circle', { cx:50, cy:50, r:40, fill:'none', stroke:track, 'stroke-width':10 }));
  const dash = Math.max(0, Math.min(100, pct)) / 100 * (2*Math.PI*40);
  svg.appendChild(svgEl('circle', { cx:50, cy:50, r:40, fill:'none', stroke:fg, 'stroke-width':10,
    'stroke-dasharray':`${dash.toFixed(1)} 999`, 'stroke-linecap':'butt',
    transform:'rotate(-90 50 50)' }));
  const t = svgEl('text', { x:50, y:57, 'text-anchor':'middle', fill:fg,
    'font-family':'Archivo', 'font-weight':900, 'font-size':20 });
  t.textContent = Math.round(pct) + '%';
  svg.appendChild(t);
  return svg;
}

/* ---------- glifo de sesión: radial compacto para filas y marcas ----------
   Igual lenguaje que la brújula del techo, a tamaño de icono:
   radio = intensidad relativa (zona objetivo), color = disciplina,
   marca roja si cruzó el umbral, punto si es benchmark. */
function glifoSesion(s){
  const svg = svgEl('svg', { viewBox:'0 0 100 100' });
  const cx = 50, cy = 50;
  const color = discColor(s.disciplina);
  const zonaMax = 6;
  const r = 14 + (Math.min(s.zona_obj || 3, zonaMax) / zonaMax) * 26;

  svg.appendChild(svgEl('circle', { cx, cy, r:34, fill:'none', stroke:'#262626', 'stroke-width':1 }));
  const cruzado = s.rec != null && s.rec >= 67;
  svg.appendChild(svgEl('line', {
    x1:cx, y1:cy, x2:cx, y2:(cy-r).toFixed(1),
    stroke: cruzado ? '#E72C5B' : color, 'stroke-width': cruzado ? 5 : 3.5,
    'stroke-linecap':'round',
  }));
  if(s.wod){
    svg.appendChild(svgEl('circle', { cx, cy:(cy-r).toFixed(1), r:5, fill:'#EBFA64' }));
  }
  svg.appendChild(svgEl('circle', { cx, cy, r:3, fill:'#fff' }));
  return svg;
}

/* secuenciador de semana: 7 celdas coloreadas por disciplina, altura = recuperación */
function celdaDia(d){
  const div = document.createElement('div');
  div.className = 'cell';
  div.style.background = discColor(d.disciplina) || '#262626';
  if(d.rec != null) div.style.opacity = Math.max(0.35, Math.min(1, d.rec/100)).toFixed(2);
  else div.style.opacity = 0.18;
  return div;
}

</script>
<script>
/* ===================================================================
   UMBRAL RADIAL · lógica de producción v2
   Semana absorbe Plan (dateline anual + análisis semanal + edición
   in situ de los 7 días). Registro es archivo buscable. Marcas es
   un tracker de récords personales libres, no atado a WODs con nombre.
   =================================================================== */
const CFG = { RACE:'2026-12-12', THR:67, INICIO_BLOQUE:'2026-06-22', SEMANAS_BLOQUE:8 };
const DASH = '—';
const $ = id => document.getElementById(id);
const esc = s => (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nn = n => String(n).padStart(2,'0');
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = v => v==null ? null : Math.round(v*10)/10;

const D = iso => new Date(iso+'T00:00:00Z');
const hoyISO = () => new Date().toISOString().slice(0,10);
const HOY = hoyISO();
const THR = CFG.THR;
const fd = (iso,o) => D(iso).toLocaleDateString('es-ES',{timeZone:'UTC',...(o||{day:'2-digit',month:'short'})}).replace('.','');
const addD = (iso,n) => { const d=D(iso); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const lunesDe = iso => { const d=D(iso); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10); };

let DIAS = [], PLANES = [], RECORDS = [], S = [], byDate = new Map();
let sucioPlan = false, sucioRecords = false;

async function cargar(){
  const j = async p => { try{ const r = await fetch(p,{cache:'no-store'}); return r.ok ? await r.json() : null; } catch(e){ return null; } };
  DIAS = (await j('data/index.json')) || [];
  PLANES = (await j('data/planes.json')) || [];
  RECORDS = (await j('data/records.json')) || [];
  if(!DIAS.length){
    const m = await j('data/manifest.json');
    if(Array.isArray(m)){ const res = await Promise.all(m.map(d => j(`data/${d}.json`))); DIAS = res.filter(Boolean); }
  }
  DIAS = DIAS.filter(d=>d && d.date).sort((a,b)=>b.date.localeCompare(a.date));
  byDate = new Map(DIAS.map(d=>[d.date,d]));
  construirSesiones();
}
const DISC_LIST = ['Crossfit','Hyrox','Carrera','Gimnásticos','Fuerza','Descanso'];
function discDe(w){
  if(!w) return null;
  const s=(w.sport_name||'').toLowerCase();
  if(s.includes('running')) return 'Carrera';
  if(s.includes('walking')||s.includes('hiking')) return 'Caminar';
  if(s.includes('weightlifting')||s.includes('strength')) return 'Fuerza';
  if(s.includes('functional')) return 'Crossfit';
  if(s.includes('hiit')) return 'Hyrox';
  if(s.includes('yoga')||s.includes('pilates')) return 'Movilidad';
  if(s.includes('cycling')||s.includes('bik')) return 'Bici';
  if(s.includes('rowing')) return 'Remo';
  return w.sport_name || null;
}
function construirSesiones(){
  const plan = new Map();
  PLANES.forEach(p => Object.entries(p.dias||{}).forEach(([iso,e]) => plan.set(iso,e)));
  const fechas = new Set([...plan.keys(), ...DIAS.filter(d=>(d.workouts||[]).length).map(d=>d.date)]);
  S = [...fechas].map(iso => {
    const pl = plan.get(iso) || {};
    const d = byDate.get(iso) || {};
    const ws = d.workouts || [];
    const cats = [];
    if(pl.zona_objetivo) cats.push('Z'+pl.zona_objetivo);
    if(pl.rpe) cats.push('RPE '+pl.rpe);
    const min = ws.reduce((s,w)=>s+(w.duration_min||0),0) || pl.duracion_prevista || 0;
    if(min) cats.push(min+' min');
    return {
      fecha: iso, titulo: pl.titulo || ws.map(w=>w.sport_name).join(' + ') || 'Sesión',
      disciplina: pl.disciplina || discDe(ws[0]) || DASH, cats,
      desc: pl.descripcion||'', metricas: pl.metricas||'', sensaciones: pl.sensaciones||'',
      resultado: pl.resultado||'', rpe: pl.rpe||null, zona_obj: pl.zona_objetivo||null,
      rec: d.recovery_score ?? null, hrv: d.hrv_rmssd_milli ?? null,
      strain: d.day_strain ?? null, sueno: d.sleep_performance_percentage ?? null,
      workouts: ws, hecho: ws.length>0, planificado: !!pl.titulo,
      min,
    };
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

function rango(desde,hasta){
  const out=[]; let c=desde, guarda=0;
  while(c<=hasta && guarda++<400){
    out.push(byDate.get(c) ? {...byDate.get(c)} : {date:c});
    const sig=addD(c,1); if(sig===c) break; c=sig;
  }
  return out;
}
function tensionEn(iso){
  const ag = rango(addD(iso,-6), iso).map(d=>d.day_strain).filter(v=>v!=null);
  const cr = rango(addD(iso,-27), iso).map(d=>d.day_strain).filter(v=>v!=null);
  const mA = mean(ag), mC = mean(cr);
  if(mA==null || !mC) return null;
  return mA/mC;
}

function vHoy(){
  const d = byDate.get(HOY) || {};
  const s = S.find(x=>x.fecha===HOY);
  const rec = d.recovery_score;
  const cruzado = rec != null && rec >= THR;
  const ult = DIAS.slice(0,20).map(x=>x.recovery_score);

  const compassBadge = rec==null
    ? `<div class="techo-badge sindato">SIN LECTURA HOY</div>`
    : cruzado
      ? `<div class="techo-badge cruzado">CRUZADO A PROPÓSITO · TENSIÓN ${r1(tensionEn(HOY))??DASH}</div>`
      : `<div class="techo-badge dentro">DENTRO DEL TECHO</div>`;

  $('main').innerHTML = `
  <div class="pad">
    <div class="grid2">
      <div class="card lima">
        <div class="lbl">RECUPERACIÓN · FAN CHART</div>
        <div id="fan"></div>
        <div class="recrow">
          <span class="n">${rec??DASH}<small style="font-size:.4em">%</small></span>
          <span class="mono" style="font-size:9px">VFC ${d.hrv_rmssd_milli??DASH} · SUEÑO ${d.sleep_performance_percentage??DASH}</span>
        </div>
      </div>
      <div class="card violeta">
        <div class="lbl tx-violeta">TECHO DE HOY</div>
        <div id="compass"></div>
        ${compassBadge}
      </div>
    </div>
    ${s ? `<div class="sesionhoy">
      <div>
        <div class="lbl">SESIÓN DE HOY · ${esc(s.disciplina)}</div>
        <div class="tit">${esc(s.titulo)}</div>
        ${s.desc?`<div style="font-size:12px;margin-top:2px;opacity:.85">${esc(s.desc)}</div>`:''}
      </div>
      <div class="min">${s.min||'—'}<small class="mono" style="font-size:.3em"> MIN</small></div>
    </div>` : `<div class="sesionhoy vacio"><div class="lbl">SIN SESIÓN PLANIFICADA</div>
      <div style="font-size:13px;margin-top:6px;color:var(--dim)">Planifícala en <b style="color:#fff">Semana</b>.</div></div>`}
  </div>`;
  $('fan').appendChild(fanChart(ult, {thr:THR}));
  $('compass').appendChild(techoCompass(rec??0, THR));
}

let semAct = lunesDe(HOY);
let anioAct = D(semAct).getUTCFullYear();

function lunesSemana1(anio){ return lunesDe(`${anio}-01-01`); }
function semanasDelAnio(anio){
  const out = []; let m = lunesSemana1(anio);
  for(let i=0;i<53;i++){
    if(D(m).getUTCFullYear() > anio && i>0) break;
    out.push(m); m = addD(m,7);
  }
  return out;
}
function metricasSemana(lunes){
  const dias = rango(lunes, addD(lunes,6));
  const conRec = dias.filter(d=>d.recovery_score!=null);
  const recMedia = conRec.length ? mean(conRec.map(d=>d.recovery_score)) : null;
  const planE = PLANES.find(p=>p.semana===lunes);
  let planificados=0, hechos=0, ok=0, tot=0;
  dias.forEach(d=>{
    const e = planE && planE.dias ? planE.dias[d.date] : null;
    if(e && e.titulo && e.disciplina!=='Descanso'){
      planificados++;
      if((d.workouts||[]).length) hechos++;
    }
    if(e && e.zona_objetivo && (d.workouts||[]).length){
      const w = d.workouts[0];
      if(Array.isArray(w.zones)){ tot++; if(w.zones.indexOf(Math.max(...w.zones))===e.zona_objetivo) ok++; }
    }
  });
  const t = tensionEn(addD(lunes,6));
  return {
    recMedia: recMedia!=null?Math.round(recMedia):null,
    adherencia: planificados ? `${hechos}/${planificados}` : DASH,
    adherenciaPct: planificados ? Math.round(hechos/planificados*100) : null,
    zonaPct: tot ? Math.round(ok/tot*100) : null,
    tension: t!=null ? r1(t) : null,
  };
}
function semanaObj(lunes){
  let wk = PLANES.find(p=>p.semana===lunes);
  if(!wk){ wk = {semana:lunes, bloque:'Bloque 1', foco:'', dias:{}};
    for(let i=0;i<7;i++) wk.dias[addD(lunes,i)] = {};
    PLANES.push(wk); PLANES.sort((a,b)=>b.semana.localeCompare(a.semana)); }
  for(let i=0;i<7;i++){ const iso=addD(lunes,i); if(!wk.dias[iso]) wk.dias[iso]={}; }
  return wk;
}
const DIAS_LABEL = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];

function vSemana(){
  const wk = semanaObj(semAct);
  const met = metricasSemana(semAct);
  const semanas = semanasDelAnio(anioAct);
  const idxSel = semanas.indexOf(semAct);

  const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const mesesHtml = MESES.map((m,i)=>{
    const primerLunesMes = semanas.find(s => D(s).getUTCMonth()===i || (D(addD(s,6)).getUTCMonth()===i));
    const activo = D(semAct).getUTCMonth()===i;
    return `<span class="mes ${activo?'on':''}" data-jump="${primerLunesMes||''}">${m}</span>`;
  }).join('');

  const densidad = semanas.map((s,i)=>{
    const m = metricasSemana(s);
    let clase = '';
    if(m.recMedia!=null) clase = m.recMedia>=THR ? 'hi' : 'md';
    return `<div class="${clase} ${i===idxSel?'sel':''}" data-jump="${s}" title="${fd(s)}"></div>`;
  }).join('');

  const dias = Array.from({length:7},(_,i)=>addD(semAct,i));
  const filas = dias.map((iso,i)=>{
    const e = wk.dias[iso];
    const dia = byDate.get(iso) || {};
    const futuro = iso > HOY;
    const hecho = (dia.workouts||[]).length > 0;
    const estado = futuro ? (e.titulo?'PENDIENTE':'SIN PLAN')
      : hecho ? 'HECHA' : (e.titulo ? 'NO HECHA' : '—');
    const claseEstado = estado==='HECHA' ? 'ok' : estado==='NO HECHA' ? 'no' : 'pend';
    return `<div class="fila ${iso===HOY?'hoy':''}" data-iso="${iso}">
        <span class="dia">${DIAS_LABEL[i]} ${D(iso).getUTCDate()}${iso===HOY?'<small>HOY</small>':''}</span>
        <span class="titulo">${e.titulo?esc(e.titulo):'<span class="dim">— sin planificar —</span>'}
          ${e.disciplina?`<span class="sub">${esc(e.disciplina)}</span>`:''}</span>
        <span>${dia.recovery_score??DASH}${dia.recovery_score!=null?'%':''}</span>
        <span>${e.zona_objetivo?'Z'+e.zona_objetivo:DASH}</span>
        <span class="estado ${claseEstado}">${estado} <button class="editar" data-tog="${iso}">▸</button></span>
      </div>
      <div class="editor" data-ed="${iso}"></div>`;
  }).join('');

  $('main').innerHTML = `<div class="pad">
    <div class="hd"><h1>SEMANA</h1><span class="sub">HYROX EN ${Math.max(0,Math.ceil((D(CFG.RACE)-D(HOY))/86400000))} DÍAS</span></div>

    <div class="datebox">
      <div class="datenav">
        <button id="anioPrev">‹</button>
        <div class="meses">${mesesHtml}</div>
        <button id="anioNext">›</button>
        <span class="mono anioLbl">${anioAct}</span>
      </div>
      <div class="densidad" id="densidad">${densidad}</div>
      <div class="semlabel">SEMANA ${idxSel+1} · <b>${fd(semAct)} – ${fd(addD(semAct,6))}</b>
        <button class="chip" id="semPrev" style="margin-left:14px">◄ SEM.</button>
        <button class="chip" id="semNext">SEM. ►</button>
        <button class="chip" id="semHoy">IR A HOY</button></span>
    </div>

    <div class="dos" style="margin-top:18px">
      <div class="panel">
        <div class="lbl" style="margin-bottom:10px">ANÁLISIS DE ESTA SEMANA</div>
        <div class="metricas">
          <div><span class="mono dim" style="font-size:9px">RECUPERACIÓN MEDIA</span>
            <div class="v">${met.recMedia??DASH}${met.recMedia!=null?'%':''}</div></div>
          <div><span class="mono dim" style="font-size:9px">ADHERENCIA</span>
            <div class="v">${met.adherencia}</div>
            ${met.adherenciaPct!=null?`<div class="barra2"><i style="width:${met.adherenciaPct}%;background:var(--lima)"></i></div>`:''}</div>
          <div><span class="mono dim" style="font-size:9px">ACIERTO DE ZONA</span>
            <div class="v">${met.zonaPct??DASH}${met.zonaPct!=null?'%':''}</div>
            ${met.zonaPct!=null?`<div class="barra2"><i style="width:${met.zonaPct}%;background:var(--azul)"></i></div>`:''}</div>
          <div><span class="mono dim" style="font-size:9px">TENSIÓN TEJIDO</span>
            <div class="v" style="${met.tension>1.3?'color:var(--rojo)':''}">${met.tension??DASH}</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="lbl" style="margin-bottom:10px">FOCO DE LA SEMANA</div>
        <input type="text" id="ffoco" class="fococampo" value="${esc(wk.foco||'')}" placeholder="Base aeróbica, técnica bajo fatiga…">
        <div class="mono dim" style="font-size:9px;margin-top:10px">BLOQUE: ${esc(wk.bloque||'—')}</div>
      </div>
    </div>

    <div class="panel" style="margin-top:2px;padding:0">
      <div style="padding:14px 16px 0"><div class="lbl">PLAN DE LOS SIETE DÍAS</div></div>
      <div class="tabla" style="margin-top:10px">
        <div class="fila cab"><span>DÍA</span><span>SESIÓN</span><span>RECUP.</span><span>ZONA</span><span>ESTADO</span></div>
        ${filas}
      </div>
    </div>

    <div class="acc">
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="psave">GUARDAR EN GITHUB</button>
        <button class="btn ghost" id="pcfg">ACCESO</button>
      </span>
      <span class="mono dim" id="pmsg" style="font-size:10px">${(sucioPlan||sucioRecords)?'SIN GUARDAR':'GUARDADO'}</span>
    </div>
  </div>`;

  document.querySelectorAll('[data-jump]').forEach(el=>{
    el.onclick = () => { const j=el.dataset.jump; if(!j) return; semAct=j; anioAct=D(j).getUTCFullYear(); vSemana(); };
  });
  $('anioPrev').onclick = () => { anioAct--; semAct = semanasDelAnio(anioAct)[0]; vSemana(); };
  $('anioNext').onclick = () => { anioAct++; semAct = semanasDelAnio(anioAct)[0]; vSemana(); };
  $('semPrev').onclick = () => { semAct = addD(semAct,-7); anioAct=D(semAct).getUTCFullYear(); vSemana(); };
  $('semNext').onclick = () => { semAct = addD(semAct,7); anioAct=D(semAct).getUTCFullYear(); vSemana(); };
  $('semHoy').onclick = () => { semAct = lunesDe(HOY); anioAct = D(semAct).getUTCFullYear(); vSemana(); };
  $('ffoco').oninput = ev => { wk.foco = ev.target.value||null; marcarSucioPlan(); };
  document.querySelectorAll('[data-tog]').forEach(b=>{
    b.onclick = () => abrirEditorDia(b.dataset.tog, wk);
  });
  $('psave').onclick = guardarTodo;
  $('pcfg').onclick = pedirAcceso;
}

function marcarSucioPlan(){ sucioPlan = true; const m=$('pmsg'); if(m) m.textContent='SIN GUARDAR'; }

function abrirEditorDia(iso, wk){
  const cont = document.querySelector(`.editor[data-ed="${iso}"]`);
  if(!cont) return;
  if(cont.classList.contains('open')){ cont.classList.remove('open'); cont.innerHTML=''; return; }
  document.querySelectorAll('.editor.open').forEach(o=>{ o.classList.remove('open'); o.innerHTML=''; });
  const e = wk.dias[iso];
  cont.classList.add('open');
  cont.innerHTML = `
    <div class="campos">
      <div class="campo"><label>ZONA OBJETIVO <b id="v_${iso}_z">${e.zona_objetivo??4}</b></label>
        <input type="range" min="1" max="6" value="${e.zona_objetivo??4}" data-k="zona_objetivo"></div>
      <div class="campo"><label>RPE <b id="v_${iso}_r">${e.rpe??8}</b></label>
        <input type="range" min="1" max="10" value="${e.rpe??8}" data-k="rpe"></div>
      <div class="campo"><label>DURACIÓN <b id="v_${iso}_d">${e.duracion_prevista??45} MIN</b></label>
        <input type="range" min="10" max="90" step="5" value="${e.duracion_prevista??45}" data-k="duracion_prevista"></div>
    </div>
    <label class="tiny">DISCIPLINA</label>
    <div class="chips" data-chips>${DISC_LIST.map(d=>`<button class="chip" data-d="${d}"
      aria-pressed="${(e.disciplina||'Crossfit')===d}" style="${(e.disciplina||'Crossfit')===d?`background:${discColor(d)}`:''}">${d.toUpperCase()}</button>`).join('')}</div>
    <div class="f2" style="margin-top:12px">
      <div style="grid-column:1/-1"><label>SESIÓN</label>
        <input type="text" data-k="titulo" value="${esc(e.titulo||'')}" placeholder="Series Z3, técnica de sled…"></div>
      <div style="grid-column:1/-1"><label>DESCRIPCIÓN</label>
        <textarea data-k="descripcion" placeholder="4×8' Z3 con 2' recuperación">${esc(e.descripcion||'')}</textarea></div>
      <div><label>RESULTADO</label><input type="text" data-k="resultado" value="${esc(e.resultado||'')}" placeholder="21:04, 100kg, 7.5 rondas…"></div>
      <div><label>MÉTRICAS</label><input type="text" data-k="metricas" value="${esc(e.metricas||'')}" placeholder="Terminado en 5:40"></div>
      <div style="grid-column:1/-1"><label>SENSACIONES</label>
        <input type="text" data-k="sensaciones" value="${esc(e.sensaciones||'')}" placeholder="Piernas pesadas desde el calentamiento"></div>
    </div>`;
  cont.querySelector('[data-k="zona_objetivo"]').oninput = ev => { e.zona_objetivo=+ev.target.value; $(`v_${iso}_z`).textContent=ev.target.value; marcarSucioPlan(); };
  cont.querySelector('[data-k="rpe"]').oninput = ev => { e.rpe=+ev.target.value; $(`v_${iso}_r`).textContent=ev.target.value; marcarSucioPlan(); };
  cont.querySelector('[data-k="duracion_prevista"]').oninput = ev => { e.duracion_prevista=+ev.target.value; $(`v_${iso}_d`).textContent=ev.target.value+' MIN'; marcarSucioPlan(); };
  cont.querySelector('[data-chips]').onclick = ev => {
    const b = ev.target.closest('[data-d]'); if(!b) return;
    e.disciplina = b.dataset.d; marcarSucioPlan();
    cont.querySelectorAll('[data-chips] button').forEach(x=>{
      const on = x.dataset.d===e.disciplina;
      x.setAttribute('aria-pressed', String(on));
      x.style.background = on ? discColor(x.dataset.d) : '';
    });
  };
  ['titulo','descripcion','resultado','metricas','sensaciones'].forEach(k=>{
    const el = cont.querySelector(`[data-k="${k}"]`);
    if(el) el.oninput = ev => { e[k] = ev.target.value||null; marcarSucioPlan(); };
  });
}

const stReg = { disc:new Set(), umbral:null, texto:'', desde:'', hasta:'' };
function matchReg(s){
  if(stReg.disc.size && !stReg.disc.has(s.disciplina)) return false;
  if(stReg.umbral){ const r=s.rec; if(r==null) return false;
    if(stReg.umbral==='over' && r<THR) return false;
    if(stReg.umbral==='under' && r>=THR) return false; }
  if(stReg.desde && s.fecha < stReg.desde) return false;
  if(stReg.hasta && s.fecha > stReg.hasta) return false;
  if(stReg.texto){
    const q = stReg.texto.toLowerCase();
    const hay = [s.titulo,s.desc,s.metricas,s.sensaciones,s.disciplina,s.resultado].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function ficha(s){
  const w = (s.workouts||[])[0];
  const z = w && Array.isArray(w.zones) ? w.zones : null;
  const zs = z ? z.reduce((a,b)=>a+b,0) : 0;
  const ZC = ['#262626','#8A7CF9','#1360F9','#BFB9DA','#EBFA64','#E72C5B'];

    const b = ev.target.closest('[data-i]'); if(!b) return;
    const det = lista.querySelector(`.detalle[data-b="${b.dataset.i}"]`);
    det.classList.toggle('open');
  };
  let deb;
  $('busq').oninput = ev => { clearTimeout(deb); const v=ev.target.value;
    deb = setTimeout(()=>{ stReg.texto=v.trim(); vRegistro(); }, 200); };
  $('fdesde').onchange = ev => { stReg.desde = ev.target.value; vRegistro(); };
  $('fhasta').onchange = ev => { stReg.hasta = ev.target.value; vRegistro(); };

  };

  numero:   { lbl:'NÚMERO', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>String(v) },
  distancia:{ lbl:'DISTANCIA (KM)', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} km` },
  peso:     { lbl:'PESO (KG)', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} kg` },
  rondas:   { lbl:'RONDAS', menorMejor:false, parse:v=>parseFloat(v.replace(',','.')), fmt:v=>`${v} rondas` },

function marcarSucioRecords(){ sucioRecords = true; const m=$('pmsg2'); if(m) m.textContent='SIN GUARDAR'; const m2=$('pmsg'); if(m2) m2.textContent='SIN GUARDAR'; }

function vAnalisis(){
  const rec = DIAS.slice(0,30).map(d=>d.recovery_score).filter(v=>v!=null);
  const over = rec.filter(v=>v>=THR).length;
  const hrv = DIAS.map(d=>d.hrv_rmssd_milli).filter(v=>v!=null);
  let ok=0, tot=0;
  S.forEach(s=>{
    if(!s.zona_obj || !s.hecho) return;
    const w = (s.workouts||[])[0]; if(!w || !Array.isArray(w.zones)) return;
    tot++;
    if(w.zones.indexOf(Math.max(...w.zones)) === s.zona_obj) ok++;
  });
  const items = [];
  items.push({ tit: rec.length ? `Has cruzado el umbral ${over} de los últimos ${rec.length} días` : 'Aún no hay lecturas de recuperación',
    dt: 'ESPERABLE 15 A 20', pct: rec.length ? Math.round(over/rec.length*100) : 0, color:'#EBFA64' });
  if(hrv.length>=5){
    const dl = r1(mean(hrv.slice(0,Math.ceil(hrv.length/2))) - mean(hrv.slice(Math.ceil(hrv.length/2))));
    items.push({ tit:`Tu variabilidad ${dl>2?'está subiendo':dl<-2?'está bajando':'lleva el periodo estable'}`,
      dt:`${r1(hrv[0])} MS HOY · ${dl>0?'+':''}${dl} MS EN EL PERIODO`, pct:null, color:'#1360F9' });
  }
  if(tot){
    const ac = Math.round(ok/tot*100);
    items.push({ tit: ac>=70?'Sueles acertar la zona que planificas':ac>=40?'Aciertas la zona menos de la mitad de las veces':'Casi nunca entrenas en la zona que planificaste',
      dt:`${ok} DE ${tot} SESIONES`, pct:ac, color:'#E72C5B' });
  }
  const t = tensionEn(HOY);
  if(t!=null){
    items.push({ tit: t>1.3 ? 'La tensión del tejido está alta' : 'La tensión del tejido está en rango',
      dt:`CARGA 7D / 28D = ${r1(t)}`, pct: Math.min(100, Math.round(t*50)), color:'#8A7CF9' });
  }
  $('main').innerHTML = `<div class="pad">
    <div class="hd"><h1>ANÁLISIS</h1><span class="sub">${DIAS.length} DÍAS</span></div>
    ${items.length ? items.map(it => `<div class="analisis-item">
        <div class="tit">${esc(it.tit)}</div><div class="dt">${it.dt}</div>
        ${it.pct!=null?`<div class="barra"><i style="width:${it.pct}%;background:${it.color}"></i></div>`:''}
      </div>`).join('') : `<div class="vac"><p>Las lecturas aparecen según se acumulan días de datos.</p></div>`}
  </div>`;
}

function acceso(){
  return { owner: localStorage.getItem('umbral.owner')||'', repo: localStorage.getItem('umbral.repo')||'',
           token: sessionStorage.getItem('umbral.token')||'' };
}
function mensajeError(status, accion){
  if(status===401) return `401 · EL TOKEN NO ES VÁLIDO O HA CADUCADO — GENERA UNO NUEVO EN ACCESO`;
  if(status===403) return `403 · EL TOKEN NO TIENE PERMISO CONTENTS: READ AND WRITE EN ESTE REPO`;
  if(status===404) return `404 · REVISA USUARIO Y REPOSITORIO EN ACCESO — NO SE ENCUENTRA`;
  return `ERROR ${status} AL ${accion.toUpperCase()}`;
}
async function pedirAcceso(){
  const a = acceso();
  const owner = prompt('Usuario de GitHub', a.owner); if(owner===null) return;
  const repo = prompt('Repositorio', a.repo||'UMBRAL'); if(repo===null) return;
  const token = prompt('Token de acceso (Contents: read and write).\nSe guarda solo en esta pestaña.', a.token);
  if(token===null) return;
  const o = owner.trim(), r = repo.trim(), t = token.trim();
  localStorage.setItem('umbral.owner', o);
  localStorage.setItem('umbral.repo', r);
  sessionStorage.setItem('umbral.token', t);
  if($('pmsg')) $('pmsg').textContent = 'COMPROBANDO ACCESO…';
  if($('pmsg2')) $('pmsg2').textContent = 'COMPROBANDO ACCESO…';
  try{
    const res = await fetch(`https://api.github.com/repos/${o}/${r}`,
      { headers:{ Authorization:`Bearer ${t}`, Accept:'application/vnd.github+json' } });
    const txt = res.ok ? 'ACCESO CORRECTO' : mensajeError(res.status,'comprobar el acceso');
    if($('pmsg')) $('pmsg').textContent = txt;
    if($('pmsg2')) $('pmsg2').textContent = txt;
  }catch(e){
    if($('pmsg')) $('pmsg').textContent = 'SIN CONEXIÓN AL COMPROBAR EL ACCESO';
    if($('pmsg2')) $('pmsg2').textContent = 'SIN CONEXIÓN AL COMPROBAR EL ACCESO';
  }
}
async function ghPut(path, dataObj, mensaje){
  const {owner,repo,token} = acceso();
  if(!owner||!repo||!token) throw new Error('SIN ACCESO CONFIGURADO');
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const H = { Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json' };
  let sha = null;
  const g = await fetch(url, {headers:H});
  if(g.ok) sha = (await g.json()).sha;
  else if(g.status!==404) throw new Error(mensajeError(g.status,'leer '+path));
  const bytes = new TextEncoder().encode(JSON.stringify(dataObj,null,1));
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  const r = await fetch(url, {method:'PUT', headers:{...H,'Content-Type':'application/json'},
    body: JSON.stringify({message:mensaje, content:btoa(bin), sha: sha||undefined})});
  if(!r.ok) throw new Error(mensajeError(r.status,'guardar '+path));
}
async function guardarTodo(){
  const m1 = $('pmsg'), m2 = $('pmsg2');
  const setMsg = txt => { if(m1) m1.textContent=txt; if(m2) m2.textContent=txt; };
  if(!sucioPlan && !sucioRecords){ setMsg('NADA QUE GUARDAR'); return; }
  const {owner,repo,token} = acceso();
  if(!owner||!repo||!token){ pedirAcceso(); return; }
  setMsg('GUARDANDO…');
  try{
    if(sucioPlan){
      const limpio = PLANES.map(p=>({...p, dias:Object.fromEntries(
        Object.entries(p.dias).filter(([,e])=>e && Object.keys(e).some(k=>e[k]!=null && e[k]!=='')))}))
        .filter(p=>Object.keys(p.dias).length);
      await ghPut('data/planes.json', limpio, 'plan '+HOY);
      sucioPlan = false; construirSesiones();
    }
    if(sucioRecords){
      await ghPut('data/records.json', RECORDS, 'récords '+HOY);
      sucioRecords = false;
    }
    setMsg('GUARDADO ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  }catch(err){ setMsg(err.message); }
}

let vista = 'hoy';
function haySucio(){ return sucioPlan || sucioRecords; }
function go(id){
  const v = V.find(x=>x[0]===id); if(!v) return;
  if((vista==='semana'||vista==='marcas') && id!==vista && haySucio() && !confirm('Tienes cambios sin guardar. ¿Salir igualmente?')) return;
  vista = id;
  document.querySelectorAll('#tabs button, #mlist button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.v===id)));
  v[4]();
  cerrarMenu();
  window.scrollTo({top:0});
}
function abrirMenu(){ $('menu').dataset.open='1'; }
function cerrarMenu(){ $('menu').dataset.open='0'; }

(async function inicio(){
  $('tabs').innerHTML = V.map(([id,l])=>`<button data-v="${id}" aria-current="${id==='hoy'}">${l}</button>`).join('');
  $('tabs').onclick = ev => { const b=ev.target.closest('button'); if(b) go(b.dataset.v); };
  $('mlist').innerHTML = V.map(([id,l,t,d])=>`<li><button data-v="${id}" aria-current="${id==='hoy'}">
      <span><span class="t">${t}</span><span class="d">${d}</span></span></button></li>`).join('');
  $('mlist').onclick = ev => { const b=ev.target.closest('button'); if(b) go(b.dataset.v); };
  $('burger').onclick = () => $('menu').dataset.open==='1' ? cerrarMenu() : abrirMenu();
  $('burger2').onclick = cerrarMenu;
  document.addEventListener('keydown', e => { if(e.key==='Escape') cerrarMenu(); });
  window.addEventListener('beforeunload', e => { if(haySucio()){ e.preventDefault(); e.returnValue=''; } });

  await cargar();
  go('hoy');
})();
